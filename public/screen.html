<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karaoke · Pantalla</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="screen">
  <!-- Pantalla de inicio (desbloquea autoplay con un clic) -->
  <div id="start" class="overlay">
    <div class="start-box">
      <h1>🎤 Karaoke Party</h1>
      <p>PIN del DJ</p>
      <input id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off">
      <div id="pinMsg" class="msg err"></div>
      <button id="startBtn" class="btn primary big">Iniciar fiesta</button>
    </div>
  </div>

  <main class="stage">
    <div class="player-wrap">
      <div id="player"></div>
      <div id="idle" class="idle">
        <div>
          <h2>Escanea y anótate 👉</h2>
          <p>Busca tu canción y dale <b>Anotarme</b></p>
        </div>
      </div>
      <div id="banner" class="banner hidden"></div>
      <div id="contestView" class="contest hidden"></div>
      <div id="fx" class="fx"></div>
    </div>

    <aside class="side">
      <div class="now">
        <div class="label">CANTANDO AHORA</div>
        <div id="nowName" class="now-name">—</div>
        <div id="nowSong" class="now-song"></div>
      </div>

      <div class="label">PRÓXIMOS</div>
      <ol id="next" class="next"></ol>
      <div id="more" class="more"></div>

      <div class="qr-row">
        <div id="wifiBox" class="qr-box hidden">
          <div class="qr-step">1 · Conéctate</div>
          <img id="wifiQr" alt="QR WiFi">
          <div id="ssid" class="url"></div>
        </div>
        <div class="qr-box">
          <div id="step2" class="qr-step hidden">2 · Anótate</div>
          <img id="qr" alt="QR">
          <div id="url" class="url"></div>
          <div class="sala">Sala <b id="salaCode">····</b></div>
        </div>
      </div>

      <div id="controls" class="controls hidden">
        <button id="btnPause" class="btn">⏯️</button>
        <button id="btnSkip" class="btn">⏭️ Saltar</button>
        <button id="btnQueue" class="btn">📋 Cola</button>
      </div>
      <button id="btnContest" class="btn contest-btn hidden">🎭 Concurso de disfraces</button>
    </aside>
  </main>

  <!-- Configurar concurso -->
  <div id="contestSetup" class="overlay hidden">
    <div class="admin-box">
      <div class="admin-head">
        <h2>🎭 Concurso de disfraces</h2>
        <button id="closeSetup" class="btn">✕</button>
      </div>
      <label class="setup-label">¿Cuántos participantes?</label>
      <div class="stepper">
        <button id="cMinus" class="btn">−</button>
        <input id="cCount" type="number" min="1" max="50" value="5">
        <button id="cPlus" class="btn">+</button>
      </div>
      <label class="setup-label">Nombres o disfraces <span class="muted">(opcional)</span></label>
      <ol id="cNames" class="names-list"></ol>
      <button id="cStart" class="btn primary big">Iniciar concurso</button>
    </div>
  </div>

  <!-- Panel de administración de la cola -->
  <div id="adminPanel" class="overlay hidden">
    <div class="admin-box">
      <div class="admin-head">
        <h2>Cola completa</h2>
        <button id="closeAdmin" class="btn">✕</button>
      </div>
      <ol id="adminList" class="admin-list"></ol>
      <div class="admin-actions">
        <button id="btnNewRoom" class="btn">🔄 Nuevo código de sala</button>
        <button id="btnClear" class="btn danger">Vaciar cola</button>
      </div>
    </div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const $ = (s) => document.querySelector(s);
let socket = null;
const emit = (ev, data) => socket && socket.emit(ev, data);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let player, ytReady = false, started = false, pin = '';
let state = { current: null, queue: [] };
let loadedId = null; // id de la entrada cargada en el player

// ---------- YouTube ----------
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('player', {
    width: '100%', height: '100%',
    playerVars: { autoplay: 1, rel: 0, modestbranding: 1, playsinline: 1 },
    events: {
      onReady: () => { ytReady = true; sync(); },
      onStateChange: (e) => { if (e.data === YT.PlayerState.ENDED) songEnded(); },
      onError: () => { showBanner('⚠️ Video no disponible, saltando…'); setTimeout(songEnded, 2000); },
    },
  });
};

// Al terminar el video, avisamos al server cuál terminó (evita dobles saltos)
function songEnded() {
  if (state.current) emit('screen:ended', { id: state.current.id });
}

function sync() {
  if (!ytReady || !started) return;
  const cur = state.current;
  $('#idle').classList.toggle('hidden', !!cur);
  if (!cur) { player.stopVideo(); loadedId = null; return; }
  if (cur.id !== loadedId) {
    loadedId = cur.id;
    player.loadVideoById(cur.videoId);
    showBanner(`🎤 Turno de <b>${esc(cur.name)}</b>`);
  }
}

// ---------- UI ----------
function render() {
  const { current, queue } = state;
  $('#nowName').textContent = current ? current.name : '—';
  $('#nowSong').textContent = current ? current.title : 'Esperando cantantes…';
  const top = queue.slice(0, 3);
  $('#next').innerHTML = top.length
    ? top.map((s, i) => `<li><span class="n">${i + 1}</span><div><b>${esc(s.name)}</b><small>${esc(s.title)}</small></div></li>`).join('')
    : '<li class="muted">Nadie en cola</li>';
  $('#more').textContent = queue.length > 3 ? `+${queue.length - 3} más en la cola` : '';
  renderAdmin();
  sync();
}

function renderAdmin() {
  $('#adminList').innerHTML = state.queue.map((s) => `
    <li>
      <div><b>${esc(s.name)}</b><small>${esc(s.title)}</small></div>
      <span>
        <button class="btn small" data-a="up" data-id="${s.id}">↑</button>
        <button class="btn small" data-a="down" data-id="${s.id}">↓</button>
        <button class="btn small danger" data-a="del" data-id="${s.id}">✕</button>
      </span>
    </li>`).join('') || '<li class="muted">Vacía</li>';
}
$('#adminList').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const id = Number(b.dataset.id);
  if (b.dataset.a === 'del') emit('admin:remove', { id });
  else emit('admin:move', { id, dir: b.dataset.a });
};

let bannerT;
function showBanner(html) {
  const b = $('#banner');
  b.innerHTML = html; b.classList.remove('hidden');
  clearTimeout(bannerT);
  bannerT = setTimeout(() => b.classList.add('hidden'), 5000);
}

// ---------- Concurso de disfraces ----------
let contest = null;
let contestWasActive = false;

function renderNameInputs() {
  const n = Math.max(1, Math.min(50, Number($('#cCount').value) || 1));
  $('#cCount').value = n;
  const list = $('#cNames');
  const prev = [...list.querySelectorAll('input')].map((i) => i.value);
  list.innerHTML = Array.from({ length: n }, (_, i) =>
    `<li><input maxlength="30" placeholder="Participante ${i + 1}" value="${esc(prev[i] || '')}"></li>`).join('');
}
$('#btnContest').onclick = () => {
  if (contest) return; // ya hay uno: se controla desde la vista del concurso
  renderNameInputs();
  $('#contestSetup').classList.remove('hidden');
};
$('#closeSetup').onclick = () => $('#contestSetup').classList.add('hidden');
$('#cMinus').onclick = () => { $('#cCount').value = Number($('#cCount').value) - 1; renderNameInputs(); };
$('#cPlus').onclick = () => { $('#cCount').value = Number($('#cCount').value) + 1; renderNameInputs(); };
$('#cCount').onchange = renderNameInputs;
$('#cStart').onclick = () => {
  const names = [...$('#cNames').querySelectorAll('input')].map((i) => i.value.trim());
  emit('contest:start', { count: Number($('#cCount').value), names });
  $('#contestSetup').classList.add('hidden');
};

function renderContest() {
  const v = $('#contestView');
  const active = !!contest;
  v.classList.toggle('hidden', !active);
  $('#btnContest').textContent = active ? '🎭 Concurso en curso' : '🎭 Concurso de disfraces';
  // Pausar el karaoke mientras dura el concurso y reanudar al terminar
  if (player && ytReady) {
    if (active && !contestWasActive) player.pauseVideo?.();
    if (!active && contestWasActive && state.current) player.playVideo?.();
  }
  contestWasActive = active;
  if (!active) return;

  const { phase, candidates, total, counts } = contest;
  let body = '';
  if (phase === 'results') {
    const max = Math.max(0, ...Object.values(counts));
    const sorted = [...candidates].sort((a, b) => counts[b.id] - counts[a.id]);
    const winners = sorted.filter((c) => max > 0 && counts[c.id] === max);
    body = `
      <div class="c-winner">${winners.length
        ? `👑 ${winners.length > 1 ? '¡Empate!' : '¡Ganador!'}<b>${winners.map((w) => `#${w.id} ${esc(w.name)}`).join(' · ')}</b>`
        : 'Nadie votó 😅'}</div>
      <ol class="c-results">${sorted.map((c) => {
        const pct = total ? Math.round((counts[c.id] / total) * 100) : 0;
        return `<li class="${winners.includes(c) ? 'win' : ''}">
          <span class="c-num">${c.id}</span><span class="c-name">${esc(c.name)}</span>
          <span class="c-bar"><i style="width:${pct}%"></i></span>
          <span class="c-votes">${counts[c.id]} voto${counts[c.id] === 1 ? '' : 's'}</span></li>`;
      }).join('')}</ol>`;
  } else {
    body = `
      <div class="c-status">${phase === 'voting'
        ? `🗳️ ¡Votación abierta! Vota desde tu cel · <b>${total}</b> voto${total === 1 ? '' : 's'}`
        : 'Participantes listos · la votación abre en un momento'}</div>
      <div class="c-grid">${candidates.map((c) => `
        <div class="c-card"><span class="c-num">${c.id}</span><span class="c-name">${esc(c.name)}</span></div>`).join('')}</div>`;
  }
  const actions = {
    ready: '<button class="btn primary" data-c="open">🗳️ Abrir votación</button>',
    voting: '<button class="btn primary" data-c="close">🏁 Cerrar votación y ver ganador</button>',
    results: '<button class="btn" data-c="open">↩️ Reabrir votación</button>',
  }[phase];
  v.innerHTML = `<div class="c-inner">
      <h2>🎭 Concurso de disfraces</h2>
      ${body}
      <div class="c-actions">${actions}<button class="btn danger" data-c="end">✕ Terminar concurso</button></div>
    </div>`;
  if (phase === 'results' && counts && Object.values(counts).some((n) => n > 0)) {
    for (let i = 0; i < 24; i++) setTimeout(() => floatEmoji(['🎉', '👑', '✨', '👏'][i % 4]), i * 120);
  }
}
$('#contestView').onclick = (e) => {
  const b = e.target.closest('button[data-c]'); if (!b) return;
  if (b.dataset.c === 'end' && !confirm('¿Terminar el concurso? Se borran los votos.')) return;
  emit('contest:' + b.dataset.c);
};

// ---------- Reacciones flotantes ----------
function floatEmoji(emoji) {
  const el = document.createElement('div');
  el.className = 'float';
  el.textContent = emoji;
  el.style.left = (5 + Math.random() * 85) + '%';
  el.style.setProperty('--drift', (Math.random() * 120 - 60) + 'px');
  el.style.fontSize = (40 + Math.random() * 40) + 'px';
  $('#fx').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// ---------- Conexión (requiere PIN) ----------
async function loadInfo() {
  const r = await fetch('/api/info', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin }) });
  const info = await r.json();
  if (!r.ok) throw new Error(info.error || 'PIN incorrecto');
  $('#qr').src = info.qr;
  $('#url').textContent = info.url.replace(/^https?:\/\//, '');
  $('#salaCode').textContent = info.sala;
  if (info.wifiQr) {
    $('#wifiQr').src = info.wifiQr; $('#ssid').textContent = '📶 ' + info.ssid;
    $('#wifiBox').classList.remove('hidden'); $('#step2').classList.remove('hidden');
  }
}

function connect() {
  socket = io({ auth: { pin } });
  socket.on('state', (s) => { state = s; render(); });
  socket.on('reaction', floatEmoji);
  socket.on('contest', (c) => {
    const prevPhase = contest?.phase;
    contest = c;
    // Re-dibujar solo cuando cambia la fase o los votos (evita confeti repetido)
    if (!c || prevPhase !== c.phase || c.phase !== 'results') renderContest();
  });
  socket.on('admin-error', (m) => showBanner('🔒 ' + m));
  socket.on('room-changed', () => loadInfo().then(() => showBanner('🔄 Nuevo código: <b>' + esc($('#salaCode').textContent) + '</b>')).catch(() => {}));
  socket.on('connect_error', (err) => {
    if (err.message === 'pin' || err.message === 'locked') {
      socket.disconnect();
      showBanner('🔒 Sesión del DJ inválida, recarga la página');
    }
  });
}

$('#startBtn').onclick = async () => {
  pin = $('#pin').value.trim();
  if (!pin) { $('#pinMsg').textContent = 'Escribe el PIN'; return; }
  $('#startBtn').disabled = true;
  try {
    await loadInfo();
  } catch (e) {
    $('#pinMsg').textContent = e.message;
    $('#startBtn').disabled = false;
    return;
  }
  try { sessionStorage.setItem('djpin', pin); } catch {}
  connect();
  started = true;
  $('#controls').classList.remove('hidden');
  $('#btnContest').classList.remove('hidden');
  $('#start').classList.add('hidden');
  document.documentElement.requestFullscreen?.().catch(() => {});
  sync();
  // Mantener despierto el servidor gratis (Render se duerme sin tráfico)
  setInterval(() => fetch('/healthz').catch(() => {}), 4 * 60e3);
};
$('#pin').onkeydown = (e) => { if (e.key === 'Enter') $('#startBtn').click(); };
try { $('#pin').value = sessionStorage.getItem('djpin') || ''; } catch {}

$('#btnSkip').onclick = () => emit('admin:next');
$('#btnPause').onclick = () => {
  if (!player) return;
  player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
};
$('#btnQueue').onclick = () => $('#adminPanel').classList.remove('hidden');
$('#closeAdmin').onclick = () => $('#adminPanel').classList.add('hidden');
$('#btnClear').onclick = () => confirm('¿Vaciar toda la cola?') && emit('admin:clear');
$('#btnNewRoom').onclick = () => confirm('¿Cambiar el código? Para anotarse de nuevo tendrán que poner el código nuevo.') && emit('admin:newRoom');

// Atajos de teclado: → saltar, espacio pausar
document.addEventListener('keydown', (e) => {
  if (!started || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') $('#btnSkip').click();
  if (e.key === ' ') { e.preventDefault(); $('#btnPause').click(); }
});
</script>
</body>
</html>
